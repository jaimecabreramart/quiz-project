<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style 3 – Bold & Dramatic</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .badge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 99px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 540px;
      width: 100%;
    }
    .step {
      font-size: 11px;
      font-weight: 500;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .progress {
      display: flex;
      gap: 4px;
      margin-bottom: 44px;
    }
    .progress-dot {
      height: 3px;
      flex: 1;
      background: #2a2a2a;
      border-radius: 2px;
    }
    .progress-dot.active { background: #e5ff00; }
    h2 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 36px;
      line-height: 1.3;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      color: #888;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .option:hover { border-color: #444; color: #ddd; }
    .option.selected { border-color: #e5ff00; color: #fff; background: #1a1a0a; }
    .option-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
    }
    .option.selected .option-num { border-color: #e5ff00; color: #e5ff00; }
    .btn {
      margin-top: 36px;
      width: 100%;
      background: #e5ff00;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="badge">Style 3 — Bold & Dramatic</div>
  <div class="card">
    <div class="step">03 / 05</div>
    <div class="progress">
      <div class="progress-dot active"></div>
      <div class="progress-dot active"></div>
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
    <h2>Your ideal weekend getaway is...</h2>
    <div class="options">
      <div class="option selected"><div class="option-num">A</div> An extreme hiking trip somewhere wild</div>
      <div class="option"><div class="option-num">B</div> Lazy beach days with good snacks</div>
      <div class="option"><div class="option-num">C</div> A cozy city with great coffee shops</div>
      <div class="option"><div class="option-num">D</div> A wellness retreat — yoga, clean eats</div>
    </div>
    <button class="btn">Next Question →</button>
  </div>
</body>
</html>
